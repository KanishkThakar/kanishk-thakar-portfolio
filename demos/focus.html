<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Room · Kanishk Thakar</title><link rel="stylesheet" href="demo.css"></head><body><header><a href="../#experiments" target="_top">← Back to portfolio</a><small>02 / Functional browser demo</small></header><main style="max-width:800px"><span class="eyebrow">Focus Room</span><h1>One thing.<br>Your full attention.</h1><div class="panel center"><div class="modes"><button data-min="25" aria-pressed="true">Focus · 25 min</button><button data-min="5" aria-pressed="false">Break · 5 min</button><button data-min="1" aria-pressed="false">Quick demo · 1 min</button></div><label for="task">What are you working on?</label><input id="task" maxlength="120" placeholder="Give this session a purpose"><div id="time" class="timer" role="timer">25:00</div><div class="row"><button id="toggle" class="primary">Start session</button><button id="reset">Reset timer</button></div><p id="status" class="status" role="status">Ready when you are.</p><div class="bar"><i id="progress" style="width:0"></i></div><p class="muted">A timestamp-based timer keeps time accurately when you change tabs. No account needed.</p></div></main><footer>Built with JavaScript, timestamp arithmetic and Page Visibility events.</footer><script src="focus.js"></script></body></html>
