<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Lab · Kanishk Thakar</title><link rel="stylesheet" href="demo.css"></head><body><header><a href="../#experiments" target="_top">← Back to portfolio</a><small>03 / Functional browser demo</small></header><main><span class="eyebrow">Orbit Lab</span><h1>A little controlled chaos.</h1><p>Move your pointer or drag on the canvas to bend the particle field. Change the system. Save your composition.</p><div class="canvas-wrap"><canvas id="field" aria-label="Interactive particle art. Use density, motion and colour controls below to change the composition."></canvas></div><div class="controls"><label>Particles <input id="density" type="range" min="40" max="220" value="120"></label><label>Motion <input id="speed" type="range" min="1" max="30" value="10"></label><label>Colour <select id="palette"><option value="cyan">Glacial cyan</option><option value="violet">Electric violet</option><option value="amber">Solar amber</option></select></label><button id="pause">Pause motion</button><button id="save" class="primary">Save PNG ↗</button></div><p id="status" class="status" role="status"></p></main><footer>Built with JavaScript, Canvas 2D, particle physics and PNG export.</footer><script src="orbit.js"></script></body></html>
